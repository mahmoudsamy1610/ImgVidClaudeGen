      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s8-end-stage", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.out" }, 0);
        // "علشان البطء مش عيب، طول ما إنت مش بتستسلم."
        tl.fromTo("#s8-end-moral", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.6);
        // "توتة توتة، خلصت الحدوتة!"
        tl.fromTo("#s8-end-theend", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.8)" }, 7.4);
        tl.fromTo("#s8-end-spark-0, #s8-end-spark-1, #s8-end-spark-2, #s8-end-spark-3", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.12 }, 7.6);
        tl.to("#s8-end-benny", { y: -24, duration: 0.25, ease: "sine.out", yoyo: true, repeat: 3 }, 6.1);
        tl.to("#s8-end-mouse", { y: -30, duration: 0.25, ease: "sine.out", yoyo: true, repeat: 3 }, 6.3);
        // Smooth fade to night at the very end
        tl.to("#s8-end-curtain", { opacity: 1, duration: 1.6, ease: "sine.inOut" }, 10.5);

        window.__timelines["s8-end"] = tl;
