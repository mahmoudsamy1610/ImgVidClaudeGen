<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Bricolage Grotesque"; font-weight: 700; src: url("assets/fonts/bricolage-grotesque-latin-700-normal.woff2") format("woff2"); }
        @font-face { font-family: "Bricolage Grotesque"; font-weight: 800; src: url("assets/fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
        @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("assets/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
        @font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("assets/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
        @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("assets/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
        @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
        @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }

        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "IBM Plex Sans", sans-serif;
          color: #e6ebf2;
        }
        .stage { position: absolute; inset: 0; }
        .display { font-family: "Bricolage Grotesque", sans-serif; }
        .mono { font-family: "IBM Plex Mono", monospace; }
        .muted { color: #9aa6b6; }
        .h2 {
          position: absolute;
          font-size: 26px;
          font-weight: 600;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #9aa6b6;
        }
        .box {
          background: #18202b;
          border: 2px solid #2c3746;
          border-radius: 18px;
          padding: 30px 34px;
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        .box-t { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 40px; line-height: 1.15; }
        .box-p { font-size: 27px; line-height: 1.45; color: #e6ebf2; }
        .box-s { font-size: 23px; line-height: 1.45; color: #9aa6b6; }
        code, .code { font-family: "IBM Plex Mono", monospace; font-size: 0.9em; color: #e6ebf2; }
        .hat { display: inline-block; font-size: 24px; font-weight: 600; padding: 8px 20px; border-radius: 999px; }
        .hat.qa { background: #15302e; color: #4fc2b8; }
        .hat.dev { background: #33240f; color: #f0a253; }
        .chips { display: flex; flex-wrap: wrap; gap: 10px; }
        .chip {
          font-family: "IBM Plex Mono", monospace;
          font-size: 21px;
          padding: 5px 13px;
          border-radius: 8px;
          background: #10151d;
          border: 2px solid #2c3746;
          white-space: nowrap;
        }
        .chip.agent { border-style: dashed; border-color: #5b6778; }
        .label { font-size: 19px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9aa6b6; }
        .gate {
          display: flex;
          align-items: center;
          gap: 12px;
          font-size: 24px;
          font-weight: 600;
          color: #f07186;
          background: #3a1720;
          border-radius: 10px;
          padding: 10px 16px;
        }
        .gate-dot { width: 14px; height: 14px; border-radius: 50%; background: #f07186; flex-shrink: 0; }
        .pill {
          position: absolute;
          display: flex;
          align-items: center;
          gap: 14px;
          font-size: 24px;
          color: #9aa6b6;
        }
        .pill-line { width: 3px; height: 40px; background: #2c3746; }

        .mini { width: 222px; padding: 18px 16px; gap: 10px; height: 290px; }
        .flow-arrow { display: flex; align-items: center; }
        .flow-arrow svg { width: 26px; height: 26px; }
      </style>

      <div id="root" data-composition-id="s6-flow" data-width="1920" data-height="1080">
        <div id="s6-flow-stage" class="stage">
        <div id="s6-flow-h2" class="h2" style="left: 200px; top: 200px">2 · How a backlog item flows</div>
        <div id="s6-flow-title" class="display" style="position: absolute; left: 200px; top: 250px; font-size: 64px; font-weight: 800">Backlog item → tested, triaged, shipped</div>
        <div id="s6-flow-lane" style="position: absolute; left: 200px; top: 400px; width: 1520px; display: flex; align-items: stretch; gap: 6px">
          <div id="s6-flow-p1" class="box mini" style="border-top: 8px solid #4fc2b8">
            <div class="mono" style="font-size: 19px; font-weight: 500; color: #4fc2b8">PHASE 1</div>
            <div class="display" style="font-size: 31px; font-weight: 800; line-height: 1.1; min-height: 70px">Analyze</div>
            <div class="gate" style="font-size: 19px; padding: 8px 10px; margin-top: auto"><span class="gate-dot"></span><span>Sign-off, no injection yet</span></div>
          </div><div class="flow-arrow"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 12h15m-6-6 6 6-6 6" stroke="#9aa6b6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg></div><div id="s6-flow-p2" class="box mini" style="border-top: 8px solid #4fc2b8">
            <div class="mono" style="font-size: 19px; font-weight: 500; color: #4fc2b8">PHASE 2</div>
            <div class="display" style="font-size: 31px; font-weight: 800; line-height: 1.1; min-height: 70px">Inject &amp; document</div>
            <div class="gate" style="font-size: 19px; padding: 8px 10px; margin-top: auto"><span class="gate-dot"></span><span>Explicit “inject”</span></div>
          </div><div class="flow-arrow"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 12h15m-6-6 6 6-6 6" stroke="#9aa6b6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg></div><div id="s6-flow-p3" class="box mini" style="border-top: 8px solid #f0a253">
            <div class="mono" style="font-size: 19px; font-weight: 500; color: #f0a253">PHASE 3</div>
            <div class="display" style="font-size: 31px; font-weight: 800; line-height: 1.1; min-height: 70px">Automate</div>
            <div class="gate" style="font-size: 19px; padding: 8px 10px; margin-top: auto"><span class="gate-dot"></span><span>Approval to start</span></div>
          </div><div class="flow-arrow"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 12h15m-6-6 6 6-6 6" stroke="#9aa6b6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg></div><div id="s6-flow-p3b" class="box mini" style="border-top: 8px solid #f0a253">
            <div class="mono" style="font-size: 19px; font-weight: 500; color: #f0a253">PHASE 3b</div>
            <div class="display" style="font-size: 31px; font-weight: 800; line-height: 1.1; min-height: 70px">Triage &amp; report</div>
            <div class="gate" style="font-size: 19px; padding: 8px 10px; margin-top: auto"><span class="gate-dot"></span><span>Preview + confirm token</span></div>
          </div><div class="flow-arrow"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 12h15m-6-6 6 6-6 6" stroke="#9aa6b6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg></div><div id="s6-flow-p3c" class="box mini" style="border-top: 8px solid #f0a253">
            <div class="mono" style="font-size: 19px; font-weight: 500; color: #f0a253">PHASE 3c</div>
            <div class="display" style="font-size: 31px; font-weight: 800; line-height: 1.1; min-height: 70px">Retest fixed bugs</div>
            <div class="gate" style="font-size: 19px; padding: 8px 10px; margin-top: auto"><span class="gate-dot"></span><span>Human approves each move</span></div>
          </div><div class="flow-arrow"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 12h15m-6-6 6 6-6 6" stroke="#9aa6b6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg></div><div id="s6-flow-p3d" class="box mini" style="border-top: 8px solid #f0a253">
            <div class="mono" style="font-size: 19px; font-weight: 500; color: #f0a253">PHASE 3d</div>
            <div class="display" style="font-size: 31px; font-weight: 800; line-height: 1.1; min-height: 70px">Run in CI</div>
            <div class="gate" style="font-size: 19px; padding: 8px 10px; margin-top: auto"><span class="gate-dot"></span><span>Never automatic</span></div>
          </div>
        </div>
        <div id="s6-flow-note" style="position: absolute; left: 200px; top: 760px; display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 600; color: #f07186"><span class="gate-dot" style="width: 22px; height: 22px"></span><span>Every phase stops for your approval</span></div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s6-flow-stage", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.out" }, 0);
        tl.to("#s6-flow-stage", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 5.15);
        tl.fromTo("#s6-flow-h2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.05);
        tl.fromTo("#s6-flow-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
        tl.fromTo("#s6-flow-p1, #s6-flow-p2, #s6-flow-p3, #s6-flow-p3b, #s6-flow-p3c, #s6-flow-p3d", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.18 }, 0.5);
        tl.fromTo("#s6-flow-lane .flow-arrow", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.18 }, 0.7);
        tl.to("#s6-flow-lane .mini", { borderColor: "#f07186", duration: 0.25, stagger: 0.15 }, 2.1);
        tl.fromTo("#s6-flow-lane .gate-dot", { scale: 1 }, { scale: 1.7, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.3);
        tl.fromTo("#s6-flow-note", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.6);

        window.__timelines["s6-flow"] = tl;
      </script>
    </template>
  </body>
</html>
