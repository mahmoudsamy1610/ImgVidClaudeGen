<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Ten Degrees logo</title>
  <desc id="logoDesc">A gradient circular outline with the number ten and a small matching degree ring.</desc>
  <defs>
    <linearGradient id="aiRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
  <circle cx="384" cy="384" r="262" fill="none" stroke="url(#aiRing)" stroke-width="12"/>
  <text x="330" y="515" text-anchor="middle" font-size="380" font-family="Georgia, 'Times New Roman', serif" fill="#29323d">1</text>
  <text x="444" y="514" text-anchor="middle" font-size="380" font-family="Georgia, 'Times New Roman', serif" fill="#29323d">0</text>
  <circle cx="542" cy="257" r="30" fill="none" stroke="url(#aiRing)" stroke-width="10"/>
</svg>
