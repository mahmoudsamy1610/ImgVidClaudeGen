        <div id="ld-spin"><svg id="ld-sp-0" class="ld-sp ld-sp-0" viewBox="0 0 24 24" width="34" height="34" fill="#D97757"><circle cx="12" cy="12" r="2.4"/></svg><svg id="ld-sp-1" class="ld-sp ld-sp-1" viewBox="0 0 24 24" width="34" height="34" fill="#D97757"><ellipse cx="12" cy="7.00" rx="2.3" ry="5.00" transform="rotate(0.0 12 12)"/><ellipse cx="12" cy="7.00" rx="2.3" ry="5.00" transform="rotate(90.0 12 12)"/><ellipse cx="12" cy="7.00" rx="2.3" ry="5.00" transform="rotate(180.0 12 12)"/><ellipse cx="12" cy="7.00" rx="2.3" ry="5.00" transform="rotate(270.0 12 12)"/></svg><svg id="ld-sp-2" class="ld-sp ld-sp-2" viewBox="0 0 24 24" width="34" height="34" fill="#D97757"><ellipse cx="12" cy="7.00" rx="1.15" ry="5.00" transform="rotate(0.0 12 12)"/><ellipse cx="12" cy="7.00" rx="1.15" ry="5.00" transform="rotate(45.0 12 12)"/><ellipse cx="12" cy="7.00" rx="1.15" ry="5.00" transform="rotate(90.0 12 12)"/><ellipse cx="12" cy="7.00" rx="1.15" ry="5.00" transform="rotate(135.0 12 12)"/><ellipse cx="12" cy="7.00" rx="1.15" ry="5.00" transform="rotate(180.0 12 12)"/><ellipse cx="12" cy="7.00" rx="1.15" ry="5.00" transform="rotate(225.0 12 12)"/><ellipse cx="12" cy="7.00" rx="1.15" ry="5.00" transform="rotate(270.0 12 12)"/><ellipse cx="12" cy="7.00" rx="1.15" ry="5.00" transform="rotate(315.0 12 12)"/></svg><svg id="ld-sp-3" class="ld-sp ld-sp-3" viewBox="0 0 24 24" width="34" height="34" fill="#D97757"><polygon points="12.00,1.50 14.10,8.36 21.09,6.75 16.20,12.00 21.09,17.25 14.10,15.64 12.00,22.50 9.90,15.64 2.91,17.25 7.80,12.00 2.91,6.75 9.90,8.36"/></svg><svg id="ld-sp-4" class="ld-sp ld-sp-4" viewBox="0 0 24 24" width="34" height="34" fill="#D97757"><ellipse cx="12" cy="6.75" rx="2.3" ry="5.25" transform="rotate(22.5 12 12)"/><ellipse cx="12" cy="6.75" rx="2.3" ry="5.25" transform="rotate(67.5 12 12)"/><ellipse cx="12" cy="6.75" rx="2.3" ry="5.25" transform="rotate(112.5 12 12)"/><ellipse cx="12" cy="6.75" rx="2.3" ry="5.25" transform="rotate(157.5 12 12)"/><ellipse cx       <script>
        const tl = gsap.timeline({ paused: true });
        const DUR = 10.0, STEP = 0.1, PINGPONG = [0, 1, 2, 3, 4, 5, 4, 3, 2, 1], VERBS = 8, PER = 1.25;
        // Spinner: show one star shape at a time, ping-ponging through the six shapes.
        for (let i = 0; i < 100; i++) {
          const t = +(i * STEP).toFixed(3);
          const f = PINGPONG[i % PINGPONG.length];
          for (let k = 0; k < 6; k++) tl.set(".ld-sp-" + k, { opacity: k === f ? 1 : 0 }, t);
        }
        // Verbs: each one drops in, shimmers once, and hands over to the next.
        for (let v = 0; v < VERBS; v++) {
          const t = +(v * PER).toFixed(3);
          tl.set(".ld-verb", { opacity: 0 }, t);
          tl.fromTo("#ld-v" + v, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, t);
          tl.fromTo("#ld-v" + v + " .ld-w", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: PER, ease: "none" }, t);
        }
        // Elapsed-seconds counter, like "(3s · esc to interrupt)".
        for (let s = 1; s <= DUR; s++) tl.set(".ld-t", { innerText: String(s) }, s - 1);
        // Robot: gentle bob (an even number of half-cycles, so it ends where it started) and a few blinks.
        tl.fromTo("#ld-robot", { y: 0 }, { y: -5, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 39 }, 0);
        tl.set("#ld-eyes", { scaleY: 1, transformOrigin: "50% 50%" }, 0);
        for (const b of [1.8, 5.3, 8.4]) tl.to("#ld-eyes", { scaleY: 0.15, duration: 0.07, yoyo: true, repeat: 1 }, b);
        window.__timelines["loader"] = tl;
      </script>
