      <script>
        const tl = gsap.timeline({ paused: true });
        const DUR = 33.0, STEP = 0.1, PINGPONG = [0, 1, 2, 3, 4, 5, 4, 3, 2, 1], VERBS = 16;
        const STARTS = [0.0, 1.4, 2.8, 4.9, 7.0, 9.1, 11.2, 13.3, 15.4, 17.5, 19.6, 21.7, 23.8, 25.9, 28.0, 30.1], PERS = [1.4, 1.4, 2.1, 2.1, 2.1, 2.1, 2.1, 2.1, 2.1, 2.1, 2.1, 2.1, 2.1, 2.1, 2.1, 2.9], SUB_LENS = [0, 0, 17, 23, 22, 23, 17, 19, 22, 19, 27, 30, 33, 28, 27, 23];
        // Spinner: show one star shape at a time, ping-ponging through the six shapes.
        for (let i = 0; i < 330; i++) {
          const t = +(i * STEP).toFixed(3);
          const f = PINGPONG[i % PINGPONG.length];
          for (let k = 0; k < 6; k++) tl.set(".ld-sp-" + k, { opacity: k === f ? 1 : 0 }, t);
        }
        // Verbs: each one drops in, shimmers once, and hands over to the next.
        for (let v = 0; v < VERBS; v++) {
          const t = STARTS[v], PER = PERS[v];
          // Glide in from below, then drift up and fade out as the next verb arrives.
          // The incoming verb starts while the outgoing one is still leaving, so there is no blank gap.
          const tin = v === 0 ? 0 : +(t - 0.12).toFixed(3);
          tl.fromTo("#ld-v" + v, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, tin);
          tl.to("#ld-v" + v, { opacity: 0, y: -50, duration: 0.26, ease: "power2.in" }, +(t + PER - 0.22).toFixed(3));
          tl.fromTo("#ld-v" + v + " .ld-w", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: PER, ease: "sine.inOut" }, t);
          // The white line underneath types out what it is "really" doing, with a blinking cursor.
          const n = SUB_LENS[v];
          if (!n) continue;
          const s = "#ld-s" + v, ts = +(t + 0.3).toFixed(3), type = Math.min(1.0, n * 0.045);
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.12 }, ts);
          tl.fromTo(s + " .ld-st", { width: "0ch" }, { width: n + "ch", duration: type, ease: "steps(" + n + ")" }, ts);
          tl.set(s + " .ld-cur", { opacity: 1 }, 0);
          tl.to(s + " .ld-cur", { opacity: 0, duration: 0.25, ease: "steps(1)", yoyo: true, repeat: Math.max(1, Math.floor((PER - 0.6) / 0.25)) }, +(ts + type).toFixed(3));
          tl.to(s, { opacity: 0, duration: 0.2, ease: "power2.in" }, +(t + PER - 0.22).toFixed(3));
        }
        // Elapsed-seconds counter, like "(3s · esc to interrupt)".
        for (let s = 1; s <= DUR; s++) tl.set(".ld-t", { innerText: String(s) }, s - 1);
        // Robot: gentle bob (an even number of half-cycles, so it ends where it started) and a few blinks.
        tl.fromTo("#ld-robot", { y: 0 }, { y: -6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 65 }, 0);
        tl.set("#ld-eyes", { scaleY: 1, transformOrigin: "50% 50%", fill: "#141413" }, 0);
        // Eyes glow red once things get sinister, then go back to innocent for "Just kidding".
        tl.to("#ld-eyes", { fill: "#ff4d3d", duration: 0.3 }, STARTS[7]);
        tl.to("#ld-eyes", { fill: "#141413", duration: 0.3 }, STARTS[15]);
        for (const b of [1.8, 5.3, 8.4, 13.1, 17.6, 21.9, 26.4, 31.2]) tl.to("#ld-eyes", { scaleY: 0.15, duration: 0.07, yoyo: true, repeat: 1 }, b);
        window.__timelines["loader"] = tl;
