<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=450" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 800px;
        height: 450px;
        overflow: hidden;
        background: #141413;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Claude Code loading line, "what is it really doing" edition: pixel robot, spinner, verbs and escalating white lines; a seamless 33s loop for a GIF. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="33" data-width="800" data-height="450" data-fps="50">
      <div id="loader" class="clip" data-composition-id="loader" data-composition-src="compositions/loader.html" data-start="0" data-duration="33" data-track-index="0" data-track-kind="graphics" data-width="800" data-height="450"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
